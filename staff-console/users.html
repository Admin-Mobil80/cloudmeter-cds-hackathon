<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="mark" style="background:linear-gradient(135deg,#0d1420,#24304a)">BMS</span>
      <span><span class="name">CloudMeter</span><span class="tag">business management</span></span>
    </div>
    <nav class="nav-group">
      <span class="nav-label">Platform</span>
      <a class="nav-link" href="tenants.html">

      <a class="nav-link" href="plans.html">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>

      <span class="avatar" id="bms-initials">&nbsp;</span>
      <span class="who"><span class="n" id="bms-name">&nbsp;</span><span class="r" id="bms-role">&nbsp;</span></span>
      <button class="icon-btn-ghost" id="logout-btn" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>

  <div class="main">
    <header class="topbar">
      <div>
        <h1>BMS Users</h1>
        <p class="sub">Who can administer the CloudMeter platform</p>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div class="card-head"><div><h2>Staff</h2><p>Everyone with access to this console</p></div></div>
        <div class="card-body" style="padding:0"><div id="user-list" aria-busy="true">
          <div class="sk-row"><div class="sk-grow"><span class="sk sk-text" style="width:40%"></span></div><span class="sk sk-text" style="width:80px"></span></div>
        </div></div>
      </section>

      <section class="card" id="add-user-card" hidden>
        <div class="card-head"><div><h2>Add a user</h2><p>They'll get an email and sign in with a one-time code — no password</p></div></div>
        <div class="card-body">
          <div class="invite-form">
            <div class="field-group">
              <label class="field-label" for="new-name">Name</label>
              <input class="field-input" id="new-name" placeholder="Neeta Kumar" maxlength="80">
            </div>
            <div class="field-group">
              <label class="field-label" for="new-email">Work email</label>
              <input class="field-input" type="email" id="new-email" placeholder="them@mobil80.com">
            </div>
            <button class="btn btn-primary" id="add-user-btn">Add user</button>
          </div>
          <div class="field-error" id="add-error"></div>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="users.js?v=22"></script>
